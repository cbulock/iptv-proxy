services:
  portal:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/portal.sqlite
      IPTV_GATEWAY_INTERNAL_URL: http://iptv-gateway:3400
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - portal-data:/data
    ports:
      - "127.0.0.1:3300:3000"
  iptv-gateway:
    profiles: [iptv]
    build: ./integrations/iptv
    restart: unless-stopped
    env_file: .env
    environment:
      PORTAL_INTERNAL_URL: http://portal:3000
      IPTV_VIEWER_URL: http://iptv-viewer:3000
      PORT: 3400
    ports:
      - "127.0.0.1:3400:3400"
    depends_on:
      portal:
        condition: service_healthy
      iptv-viewer:
        condition: service_started
  iptv-viewer:
    profiles: [iptv]
    build: ${IPTV_VIEWER_BUILD_CONTEXT:-../iptv-web}
    restart: unless-stopped
volumes:
  portal-data:
