name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-security:
    name: Lint and Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting with Prettier
        run: npm run format:check

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Run admin npm audit
        working-directory: admin
        run: npm audit --audit-level=moderate

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Validate output formats
        run: node scripts/validate-formats.js

  build-admin:
    name: Build Admin UI
    runs-on: ubuntu-latest
    needs: [lint-and-security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install admin deps
        working-directory: admin
        run: npm ci

      - name: Build admin UI
        working-directory: admin
        run: npm run build

      - name: Upload built admin
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: public/admin

  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-security, test, build-admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built admin
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: public/admin

      - name: Set up QEMU (for multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # PR images are loaded into the runner so Trivy scans this exact build,
          # rather than an image tag that was never pushed to a registry.
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            iptv-proxy-ci:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify scan image is available
        if: github.event_name == 'pull_request'
        env:
          SCAN_IMAGE: iptv-proxy-ci:${{ github.sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$BUILD_DIGEST"
          docker image inspect "$SCAN_IMAGE" > /dev/null
          {
            echo "### Container scan target"
            echo "- Image: \`$SCAN_IMAGE\`"
            echo "- Build digest: \`$BUILD_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        if: github.event_name == 'pull_request'
        with:
          image-ref: iptv-proxy-ci:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify Trivy report
        if: always() && github.event_name == 'pull_request'
        run: test -s trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name == 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'
